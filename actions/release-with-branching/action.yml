name: 'Release with Branching'
description: 'Publish packages to npm and create maintenance branches for multi-release workflows'
inputs:
  ENABLE_MULTI_RELEASE:
    description: 'Enable multi-release mode for handling maintenance branches'
    required: false
    default: 'false'
  NODE_AUTH_TOKEN:
    description: 'NPM authentication token used for publishing packages'
    required: true
  GITHUB_TOKEN:
    description: 'GitHub token used for repository access during release'
    required: true
runs:
  using: node20
  main: dist/index.js
